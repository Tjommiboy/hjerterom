<title>Hjerterom</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky wordmark bar, one centered column (~68rem); items as hang-tag cards in an auto-fill grid; owner tools appear inline in edit mode */
:root{
  --paper:#EEF1EF; --surface:#FFFFFF; --ink:#1B2321; --muted:#566360; --line:#D3DAD7;
  --heart:#AF2347; --heart-soft:#F6E3E8; --moss:#356447; --moss-soft:#E1EEE5; --amber:#9A5C14; --amber-soft:#F5EAD9;
  --overlay:rgba(20,26,24,.5);
  --f-display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#121816; --surface:#1A211F; --ink:#E6ECE9; --muted:#9CA9A5; --line:#2C3532;
  --heart:#EC6A88; --heart-soft:#3A1E26; --moss:#7DB892; --moss-soft:#1D3024; --amber:#DDA45E; --amber-soft:#35291A;
  --overlay:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#121816; --surface:#1A211F; --ink:#E6ECE9; --muted:#9CA9A5; --line:#2C3532;
  --heart:#EC6A88; --heart-soft:#3A1E26; --moss:#7DB892; --moss-soft:#1D3024; --amber:#DDA45E; --amber-soft:#35291A;
  --overlay:rgba(0,0,0,.6); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font:16px/1.6 var(--f-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:68rem;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);line-height:1.1;text-wrap:balance;margin:0;letter-spacing:-.015em}
p{margin:0}
a{color:inherit}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--heart);outline-offset:2px}
.label{font:500 .72rem/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* header */
header.site{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
header.site .wrap{display:flex;align-items:center;gap:12px 24px;flex-wrap:wrap;padding-block:12px}
.brand{display:flex;align-items:center;gap:8px;text-decoration:none;font:800 1.5rem/1 var(--f-display);letter-spacing:-.03em}
.brand svg{width:26px;height:26px;flex:none}
nav.main{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
nav.main a{text-decoration:none;padding:7px 12px;border-radius:999px;font-weight:700;font-size:.95rem;color:var(--muted)}
nav.main a:hover{color:var(--ink);background:var(--paper)}
nav.main a[aria-current="page"]{color:var(--ink);background:var(--heart-soft)}
.ownerbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 16px;font-weight:700;font-size:.92rem;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--heart);border-color:var(--heart);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#1a0c10}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{color:#1a0c10}}
.btn.primary:hover{filter:brightness(1.07)}
.btn.small{padding:5px 11px;font-size:.82rem}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--paper);border-color:var(--line)}
.btn.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.badge{display:inline-block;background:var(--ink);color:var(--paper);font:500 .68rem/1 var(--f-mono);padding:5px 7px;border-radius:999px;margin-left:2px}

main{padding-block:32px 72px;display:grid;gap:48px}
.section-head{display:flex;align-items:end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.section-head h2{font-size:clamp(1.5rem,3vw,2rem)}

/* intro */
.intro{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:28px;align-items:end}
.intro h1{font-size:clamp(2.2rem,6vw,4rem);font-weight:800;letter-spacing:-.035em}
.intro h1 em{font-style:normal;color:var(--heart)}
.intro .lede{margin-top:16px;font-size:1.12rem;max-width:36rem;color:var(--muted)}
.hours{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px}
.hours pre{margin:8px 0 0;font:400 .92rem/1.7 var(--f-mono);white-space:pre-wrap}
@media (max-width:720px){.intro{grid-template-columns:1fr}}

/* events */
.events{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:16px}
.event{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.datetile{width:64px;text-align:center;border-radius:8px;background:var(--heart);color:#fff;padding:8px 0 9px;align-self:start}
:root[data-theme="dark"] .datetile{color:#1a0c10}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .datetile{color:#1a0c10}}
.datetile .d{display:block;font:800 1.8rem/1 var(--f-display)}
.datetile .m{display:block;font:500 .7rem/1 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;margin-top:4px}
.event h3{font-size:1.15rem}
.meta{font:400 .82rem/1.5 var(--f-mono);color:var(--muted);margin-top:4px}
.event p.body,.post p.body{margin-top:8px}
.event.past{opacity:.6}

/* news */
.news{display:grid;gap:0;border-top:1px solid var(--line)}
.post{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;padding:22px 0;border-bottom:1px solid var(--line)}
.post .text{max-width:42rem;min-width:0}
.post h3{font-size:1.3rem;margin-top:6px}
.post img{width:180px;aspect-ratio:4/3;object-fit:cover;border-radius:8px;max-width:100%}
.body{white-space:pre-line}
@media (max-width:600px){.post{grid-template-columns:1fr}.post img{width:100%}}
.rowtools{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.example{display:inline-block;font:500 .66rem/1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;border:1px dashed var(--muted);color:var(--muted);padding:3px 6px;border-radius:4px;margin-left:6px;vertical-align:middle}

/* items as hang tags */
.filters{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:20px}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr));gap:20px}
.tag{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:14px 14px var(--r) var(--r);display:flex;flex-direction:column;overflow:hidden}
.tag .ph{aspect-ratio:1/1;background:var(--paper);display:grid;place-items:center;color:var(--muted);max-width:100%}
.tag .ph img{width:100%;height:100%;object-fit:cover}
.tag .hole{position:absolute;top:12px;left:12px;width:14px;height:14px;border-radius:50%;background:var(--paper);border:1.5px solid var(--line);z-index:1}
.tag .info{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.tag h3{font-size:1.1rem}
.tag .desc{color:var(--muted);font-size:.93rem}
.tag .bottom{margin-top:auto;padding-top:10px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;border-top:1px dashed var(--line)}
.price{font:500 1.15rem/1 var(--f-mono);font-variant-numeric:tabular-nums}
.price small{font-size:.75rem;color:var(--muted);margin-right:3px}
.status{position:absolute;top:10px;right:10px;z-index:1;font:500 .7rem/1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;padding:6px 9px;border-radius:999px}
.st-ledig{background:var(--moss-soft);color:var(--moss)}
.st-reservert{background:var(--amber-soft);color:var(--amber)}
.st-solgt{background:var(--ink);color:var(--paper)}
.tag.sold .ph{filter:grayscale(1);opacity:.6}
.actions{display:flex;gap:6px;flex-wrap:wrap}

/* prose pages */
.page{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,20rem);gap:40px;align-items:start}
.page h1{font-size:clamp(2rem,5vw,3.2rem);font-weight:800;letter-spacing:-.03em;margin-bottom:20px}
.prose{max-width:40rem;display:grid;gap:14px;font-size:1.06rem}
.aside{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:grid;gap:14px}
@media (max-width:760px){.page{grid-template-columns:1fr}}
.contact-list{display:grid;gap:0;border-top:1px solid var(--line);max-width:40rem}
.contact-row{display:grid;grid-template-columns:7rem minmax(0,1fr) auto;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.contact-row .v{font-size:1.08rem;user-select:all;overflow-wrap:anywhere;min-width:0}
@media (max-width:480px){.contact-row{grid-template-columns:minmax(0,1fr) auto}.contact-row .label{grid-column:1/-1}}

/* requests */
.reqs{display:grid;gap:12px}
.req{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:6px}
.req.done{opacity:.6}
.req .top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{font:500 .7rem/1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;padding:5px 8px;border-radius:999px;background:var(--heart-soft);color:var(--heart)}
.pill.reserver{background:var(--amber-soft);color:var(--amber)}
.pill.melding{background:var(--moss-soft);color:var(--moss)}

.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:28px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--ink);font-family:var(--f-display);font-size:1.15rem;margin-bottom:4px}
.notice{background:var(--amber-soft);color:var(--ink);border-radius:var(--r);padding:12px 16px;font-size:.93rem}

/* overlay editor */
.overlay{position:fixed;inset:0;z-index:20;background:var(--overlay);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));overflow:auto}
.sheet{background:var(--surface);border-radius:14px;width:min(100%,34rem);padding:24px;display:grid;gap:16px;max-height:100%;overflow:auto}
.sheet h2{font-size:1.4rem}
.field{display:grid;gap:6px}
.field label{font-weight:700;font-size:.9rem}
.field .hint{font-size:.82rem;color:var(--muted)}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=tel],input[type=email],textarea,select{width:100%;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
textarea{min-height:110px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:480px){.grid2{grid-template-columns:1fr}}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg label{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer;font-weight:700;font-size:.88rem}
.seg input{accent-color:var(--heart)}
.sheet .foot{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.err{color:var(--heart);font-size:.9rem}
.ok{background:var(--moss-soft);color:var(--ink);border-radius:8px;padding:14px}
footer.site{border-top:1px solid var(--line);padding-block:24px;color:var(--muted);font-size:.88rem}
footer.site .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
@media (prefers-reduced-motion:no-preference){.tag{transition:transform .15s ease}.tag:hover{transform:translateY(-2px)}}
</style>

<header class="site">
  <div class="wrap">
    <a class="brand" href="#nyheter" aria-label="Hjerterom, forside">
      <svg viewBox="0 0 26 26" aria-hidden="true"><path d="M13 22.5 4.2 13.9A5.3 5.3 0 0 1 13 7.2a5.3 5.3 0 0 1 8.8 6.7Z" fill="var(--heart)"/><rect x="9.5" y="12" width="7" height="6" rx="1" fill="var(--surface)"/></svg>
      Hjerterom
    </a>
    <nav class="main" id="nav">
      <a href="#nyheter">Nytt</a>
      <a href="#varer">Varer</a>
      <a href="#om-oss">Om oss</a>
      <a href="#kontakt">Kontakt</a>
    </nav>
    <div class="ownerbar" id="ownerbar" hidden></div>
  </div>
</header>

<main class="wrap" id="main"></main>

<footer class="site"><div class="wrap"><span>Hjerterom · gjenbruk og fellesskap</span><span id="foot-hours"></span></div></footer>

<div id="overlay-root"></div>

<script>
(function(){
"use strict";
const S = {
  db:null, assets:null, uid:null, canEdit:false, editMode:false,
  posts:[], items:[], info:{}, requests:[], myReq:null,
  loaded:{posts:false,items:false,info:false}, noDb:false,
  cat:"Alle", hideSold:true, reqFilter:"open"
};
const STATUS = {ledig:"Ledig", reservert:"Reservert", solgt:"Solgt"};
const MONTHS = ["jan","feb","mar","apr","mai","jun","jul","aug","sep","okt","nov","des"];
const $ = s => document.querySelector(s);

function h(tag, attrs, ...kids){
  const el = document.createElement(tag);
  if (attrs) for (const k in attrs){
    const v = attrs[k];
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "text") el.textContent = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat()){ if (c == null || c === false) continue; el.append(c.nodeType ? c : document.createTextNode(String(c))); }
  return el;
}
const imgSrc = id => "/_blob/" + id;
const todayISO = () => { const d = new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
const fmtDate = iso => { try { return new Intl.DateTimeFormat("nb-NO",{weekday:"long",day:"numeric",month:"long"}).format(new Date(iso+"T12:00")); } catch(e){ return iso; } };
const fmtStamp = ms => { try { return new Intl.DateTimeFormat("nb-NO",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}).format(new Date(ms)); } catch(e){ return ""; } };
const fmtPrice = n => new Intl.NumberFormat("nb-NO").format(Number(n)||0);
const ex = d => d.example ? h("span",{class:"example"},"Eksempel") : null;

/* ---------- routing ---------- */
const ROUTES = ["nyheter","varer","om-oss","kontakt","foresporsler"];
function route(){ const r = (location.hash||"").replace("#",""); return ROUTES.includes(r) ? r : "nyheter"; }
window.addEventListener("hashchange", () => { render(); window.scrollTo(0,0); });

/* ---------- render ---------- */
function render(){
  const r = route();
  document.querySelectorAll("#nav a").forEach(a => { if (a.getAttribute("href")==="#"+r) a.setAttribute("aria-current","page"); else a.removeAttribute("aria-current"); });
  renderOwnerbar();
  const main = $("#main");
  let view;
  if (r === "varer") view = viewItems();
  else if (r === "om-oss") view = viewAbout();
  else if (r === "kontakt") view = viewContact();
  else if (r === "foresporsler" && S.canEdit) view = viewRequests();
  else view = viewHome();
  main.replaceChildren(...[].concat(view));
  const fh = $("#foot-hours"); fh.textContent = S.info.address || "";
}

function renderOwnerbar(){
  const bar = $("#ownerbar");
  if (!S.canEdit){ bar.hidden = true; return; }
  bar.hidden = false;
  const open = S.requests.reduce((n,r)=> n + Object.values(r.list||{}).filter(x=>!x.handled).length, 0);
  bar.replaceChildren(
    h("a",{class:"btn small"+(route()==="foresporsler"?" on":""),href:"#foresporsler"},"Forespørsler", open ? h("span",{class:"badge num"},open) : null),
    h("button",{class:"btn small"+(S.editMode?" on":""),type:"button","aria-pressed":String(S.editMode),onclick:()=>{S.editMode=!S.editMode;render();}}, S.editMode ? "Ferdig" : "Rediger siden")
  );
}

function loadingOr(key, fn){
  if (S.noDb) return h("div",{class:"empty"},h("strong",null,"Innholdet kan ikke vises her"),"Åpne siden mens du er logget inn for å se nyheter og varer.");
  if (!S.loaded[key]) return h("div",{class:"empty"},h("strong",null,"Henter innhold…"),"Nyheter, arrangementer og varer vises her straks.");
  return fn();
}

/* home */
function viewHome(){
  const i = S.info;
  const intro = h("section",{class:"intro"},
    h("div",null,
      h("h1",null, i.tagline ? i.tagline : ["Gjenbruk med ", h("em",null,"hjerterom"), "."]),
      h("p",{class:"lede"}, i.lede || "En bruktbutikk og et møtested. Vi gir ting et nytt liv, så vi kjøper mindre nytt og tar bedre vare på det vi har.")
    ),
    h("div",{class:"hours"}, h("div",{class:"label"},"Åpningstider"), h("pre",null, i.hours || "Legges ut snart"),
      S.editMode ? h("div",{class:"rowtools"}, h("button",{class:"btn small",type:"button",onclick:openInfoEditor},"Rediger åpningstider og tekst")) : null)
  );

  const evHead = h("div",{class:"section-head"}, h("h2",null,"Kommer"),
    S.editMode ? h("button",{class:"btn primary small",type:"button",onclick:()=>openPostEditor({kind:"arrangement"})},"+ Nytt arrangement") : null);
  const newsHead = h("div",{class:"section-head"}, h("h2",null,"Nytt fra butikken"),
    S.editMode ? h("button",{class:"btn primary small",type:"button",onclick:()=>openPostEditor({kind:"nyhet"})},"+ Ny nyhet") : null);

  const evBody = loadingOr("posts", () => {
    const t = todayISO();
    let ev = S.posts.filter(p=>p.kind==="arrangement");
    const upcoming = ev.filter(p=>(p.date||"")>=t).sort((a,b)=>(a.date+(a.time||"")).localeCompare(b.date+(b.time||"")));
    const past = S.editMode ? ev.filter(p=>(p.date||"")<t).sort((a,b)=>b.date.localeCompare(a.date)) : [];
    if (!upcoming.length && !past.length) return h("div",{class:"empty"},h("strong",null,"Ingen arrangementer akkurat nå"), S.editMode ? "Legg til et arrangement med knappen over." : "Følg med her for byttedager, verksteder og salg.");
    return h("div",{class:"events"}, upcoming.map(p=>eventCard(p,false)), past.map(p=>eventCard(p,true)));
  });

  const newsBody = loadingOr("posts", () => {
    const n = S.posts.filter(p=>p.kind!=="arrangement").sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
    if (!n.length) return h("div",{class:"empty"},h("strong",null,"Ingen nyheter ennå"), S.editMode ? "Skriv den første nyheten med knappen over." : "Nyheter fra butikken dukker opp her.");
    return h("div",{class:"news"}, n.map(newsItem));
  });

  return [intro, h("section",null,evHead,evBody), h("section",null,newsHead,newsBody)];
}

function eventCard(p, past){
  const d = new Date((p.date||todayISO())+"T12:00");
  return h("article",{class:"event"+(past?" past":"")},
    h("div",{class:"datetile","aria-hidden":"true"}, h("span",{class:"d num"},d.getDate()), h("span",{class:"m"},MONTHS[d.getMonth()])),
    h("div",{style:"min-width:0"},
      h("h3",null,p.title||"Uten tittel", ex(p)),
      h("div",{class:"meta"}, [fmtDate(p.date), p.time ? "kl. "+p.time : null, p.place].filter(Boolean).join(" · "), past ? " · avholdt" : ""),
      p.body ? h("p",{class:"body"},p.body) : null,
      p.imageId ? h("img",{src:imgSrc(p.imageId),alt:"",style:"margin-top:10px;border-radius:8px;width:100%;aspect-ratio:16/9;object-fit:cover"}) : null,
      S.editMode ? rowTools("posts", p, ()=>openPostEditor(p)) : null)
  );
}
function newsItem(p){
  return h("article",{class:"post"},
    h("div",{class:"text"},
      h("div",{class:"label"}, p.createdAt ? fmtStamp(p.createdAt) : "Nyhet"),
      h("h3",null,p.title||"Uten tittel", ex(p)),
      p.body ? h("p",{class:"body"},p.body) : null,
      S.editMode ? rowTools("posts", p, ()=>openPostEditor(p)) : null),
    p.imageId ? h("img",{src:imgSrc(p.imageId),alt:""}) : null
  );
}

function rowTools(coll, d, onEdit){
  const box = h("div",{class:"rowtools"});
  const normal = () => box.replaceChildren(
    h("button",{class:"btn small",type:"button",onclick:onEdit},"Rediger"),
    h("button",{class:"btn small ghost",type:"button",onclick:confirmDel},"Slett"));
  const confirmDel = () => box.replaceChildren(
    h("span",{style:"align-self:center;font-weight:700;font-size:.88rem"},"Slette «"+(d.title||"")+"»?"),
    h("button",{class:"btn small primary",type:"button",onclick:async()=>{
      try { await S.db.collection(coll).doc(d.id).delete(); if (d.imageId && S.assets) S.assets.delete(d.imageId).catch(()=>{}); }
      catch(e){ box.append(h("span",{class:"err"},"Kunne ikke slette. Prøv igjen.")); }

/* ---------- overlays ---------- */
function openSheet(title, buildBody){
  const root = $("#overlay-root");
  const close = () => { root.replaceChildren(); document.removeEventListener("keydown", esc); };
  const esc = e => { if (e.key==="Escape") close(); };
  document.addEventListener("keydown", esc);
  const sheet = h("div",{class:"sheet",role:"dialog","aria-modal":"true","aria-label":title}, h("h2",null,title));
  const ov = h("div",{class:"overlay",onclick:e=>{ if (e.target===ov) close(); }}, sheet);
  buildBody(sheet, close);
  root.replaceChildren(ov);
  const f = sheet.querySelector("input,textarea,select"); if (f) f.focus();
}
function field(label, input, hint){ return h("div",{class:"field"}, h("label",{for:input.id},label), input, hint ? h("span",{class:"hint"},hint) : null); }

async function shrink(file){
  try {
    const bmp = await createImageBitmap(file);
    const max = 1400, s = Math.min(1, max/Math.max(bmp.width,bmp.height));
    const c = document.createElement("canvas"); c.width = Math.round(bmp.width*s); c.height = Math.round(bmp.height*s);
    c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
    return await new Promise(res => c.toBlob(b => res(b||file), "image/jpeg", .85));
  } catch(e){ return file; }
}
async function uploadIfAny(input){
  const f = input && input.files && input.files[0];
  if (!f || !S.assets) return null;
  const r = await S.assets.upload(await shrink(f));
  return r.id;
}
function imageField(cur){
  if (!S.assets) return [null,null];
  const inp = h("input",{type:"file",id:"ed-img",accept:"image/*"});

render();
(async function boot(){
  if (!window.claude || typeof window.claude.use !== "function"){ S.noDb = true; render(); return; }
  const [db, user, assets] = await Promise.all([claude.use("db"), claude.use("user"), claude.use("assets")]);
  if (!db){ S.noDb = true; render(); return; }
  S.db = db; S.assets = assets;
  if (user){ S.canEdit = await user.canEdit(); S.uid = await user.id(); }
  const fail = () => {};
  db.collection("posts").onSnapshot(s => { S.posts = s.docs.map(d=>({id:d.id,...d.data()})); S.loaded.posts=true; render(); }, fail);
  db.collection("items").onSnapshot(s => { S.items = s.docs.map(d=>({id:d.id,...d.data()})); S.loaded.items=true; render(); }, fail);
  db.doc("site/info").onSnapshot(s => { S.info = s.exists ? s.data() : {}; S.loaded.info=true; render(); }, fail);
  if (S.canEdit) db.collection("requests").onSnapshot(s => { S.requests = s.docs.map(d=>({id:d.id,...d.data()})); render(); }, fail);
  render();
})();
})();
</script>
